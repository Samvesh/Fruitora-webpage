# Keeps Render free-tier backends awake by pinging them every 10 minutes.
# Render spins down free services after ~15 min of inactivity; this prevents
# cold starts for end-users.

name: Keep Alive — Render Backends

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Fruitoria backend
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 60 \
            https://fruitoria.onrender.com) || true
          echo "Fruitoria responded with HTTP $HTTP_STATUS"

      - name: Ping VideoIQ RAG Chatbot backend
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 60 \
            https://videoiq-rag-chatbot.onrender.com) || true
          echo "VideoIQ RAG Chatbot responded with HTTP $HTTP_STATUS"
